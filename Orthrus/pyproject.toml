[project]
name = "orthrus"
version = "0.0.1"
requires-python = "==3.10.*"
dependencies = [
    "numpy==1.24.*",
    "pandas",
    "jupyter",
    "notebook",
    "tqdm",
    "torch==2.9.*",
    "seaborn",
    "scikit-learn",
    "lightning",
    "wandb",
    "pyfaidx",
    "pytabix",
    "cython",
    "absl-py",
    "pytest",
    # CUDA-only; on macOS orthrus.mamba falls back to a pure-PyTorch Mamba.
    "causal-conv1d; sys_platform == 'linux'",
    "mamba-ssm; sys_platform == 'linux'",
    "ipykernel",
    "genomekit>=6",
    "huggingface-hub>=0.24",
    "transformers<4.46",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# cu128: required for Blackwell (RTX 50-series, sm_120). cu121 has no sm_120 kernels.
# Only Linux pulls torch from here; macOS gets the PyPI build (CPU + MPS).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# Prebuilt CUDA wheels. Neither project publishes usable wheels to PyPI (sdist only,
# which needs nvcc and ~1h of compiling), so we pin the GitHub release artifacts that
# match python 3.10 / torch 2.9 / CUDA 12 and carry sm_120 cubins.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
causal-conv1d = { url = "https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.7.0/causal_conv1d-1.7.0+cu12torch2.9cxx11abiTRUE-cp310-cp310-linux_x86_64.whl" }
mamba-ssm = { url = "https://github.com/state-spaces/mamba/releases/download/v2.3.2.post1/mamba_ssm-2.3.2.post1+cu12torch2.9cxx11abiTRUE-cp310-cp310-linux_x86_64.whl" }